<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Long Screenshot Manual Fixture</title>
  <style>
    :root { color-scheme: light; font-family: ui-monospace, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f7; color: #172033; }
    #fixed-header {
      position: fixed; z-index: 20; inset: 0 0 auto; height: 52px; display: grid;
      place-items: center; background: #172033; color: #fff; font-weight: 800;
      letter-spacing: .14em; box-shadow: 0 2px 10px #17203366;
    }
    #ruler {
      position: absolute; z-index: 19; top: 0; left: 0; width: 78px; height: 4000px;
      pointer-events: none; border-right: 1px solid #17203355;
      background: repeating-linear-gradient(to bottom, #fff9 0 99px, #17203377 99px 100px);
      color: #172033; font-size: 10px; line-height: 1; overflow: hidden;
    }
    #ruler span { position: absolute; left: 5px; transform: translateY(-50%); }
    #main-page { position: relative; height: 4000px; }
    .band {
      height: 100px; padding: 62px 100px 8px; border-bottom: 1px solid #17203344;
      font-size: 18px; font-weight: 700;
    }
    .band:nth-child(odd) { background: #d9e8ff; }
    .band:nth-child(even) { background: #fff3cf; }
    .band small { margin-left: 14px; font-size: 12px; font-weight: 500; }
    #container-fixture {
      position: absolute; z-index: 5; top: 262px; right: 72px; width: 800px; height: 420px;
      overflow-y: auto; overflow-x: hidden; border: 3px solid #172033; background: #fff;
      box-shadow: 0 8px 24px #17203355;
    }
    #container-fixture h2 {
      position: sticky; top: 0; z-index: 2; height: 44px; margin: 0; padding: 12px 16px;
      background: #cae8c9; border-bottom: 2px solid #172033; font-size: 15px;
    }
    .row { height: 72px; padding: 24px 16px; border-bottom: 1px solid #17203333; }
    .row:nth-of-type(odd) { background: #f6fbff; }
    .row strong { display: inline-block; min-width: 95px; }
    .row code { color: #526077; }
    .image-slot { display: inline-flex; vertical-align: middle; width: 138px; height: 64px; margin-left: 18px; align-items: center; justify-content: center; background: #fff; border: 1px dashed #526077; font-size: 10px; }
    .image-slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 980px) { #container-fixture { left: 92px; right: auto; } }
  </style>
</head>
<body>
  <header id="fixed-header">FIXED HEADER</header>
  <aside id="ruler" aria-label="Content-space Y ruler"></aside>
  <main id="main-page" aria-label="4,000 CSS-pixel long page"></main>
  <section id="container-fixture" aria-label="800 by 420 internal scrolling container">
    <h2>STICKY ROW HEADER — container content-space Y = 0</h2>
  </section>
  <script>
    const page = document.querySelector('#main-page');
    for (let index = 1; index <= 40; index += 1) {
      const band = document.createElement('section');
      band.className = 'band';
      band.id = `band-${index}`;
      band.innerHTML = `BAND ${index} <small>content-space Y: ${(index - 1) * 100}–${index * 100}</small>`;
      if ([8, 18, 28].includes(index)) {
        const slot = document.createElement('span');
        slot.className = 'image-slot';
        slot.id = `image-slot-${index}`;
        slot.textContent = `IMAGE ${[8, 18, 28].indexOf(index) + 1} PENDING`;
        band.append(slot);
      }
      page.append(band);
    }

    const container = document.querySelector('#container-fixture');
    for (let index = 1; index <= 30; index += 1) {
      const row = document.createElement('div');
      row.className = 'row';
      row.id = `row-${index}`;
      row.innerHTML = `<strong>ROW ${index}</strong><code>container content-space Y: ${44 + (index - 1) * 72}–${44 + index * 72}</code>`;
      container.append(row);
    }

    const ruler = document.querySelector('#ruler');
    for (let y = 0; y <= 4000; y += 100) {
      const label = document.createElement('span');
      label.style.top = `${y}px`;
      label.textContent = `Y ${y}`;
      ruler.append(label);
    }

    function svgDataUrl(label, color) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="276" height="128" viewBox="0 0 276 128"><rect width="276" height="128" fill="${color}"/><text x="138" y="72" text-anchor="middle" font-family="monospace" font-size="22" fill="#172033">${label}</text></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }
    [[300, 8, '#f8b4b4'], [600, 18, '#b5d7ff'], [900, 28, '#c5efb8']].forEach(([delay, band, color], number) => {
      window.setTimeout(() => {
        const image = new Image();
        image.alt = `Delayed inline SVG image ${number + 1}`;
        image.src = svgDataUrl(`DELAYED IMAGE ${number + 1}`, color);
        const slot = document.querySelector(`#image-slot-${band}`);
        slot.replaceChildren(image);
      }, delay);
    });
  </script>
</body>
</html>
